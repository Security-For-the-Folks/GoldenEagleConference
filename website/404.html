<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Midwest OT Cybersecurity Summit (MOCS)</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/sftf-logo.png" />
    <style>
      :root{--navy:#0d3260;--blue:#1f4f8f;--line:#cfdae8;--text:#23384e;--muted:#61758f;--gold:#f4c300}
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
        font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);
        background:linear-gradient(160deg,var(--navy),var(--blue))}
      .card{width:100%;max-width:520px;background:#fff;border:1px solid var(--line);
        border-radius:14px;padding:40px 32px;text-align:center;
        box-shadow:0 18px 48px rgba(0,0,0,.28)}
      .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
        letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
      h1{margin:0 0 12px;font-size:26px;line-height:1.25;color:var(--navy)}
      p{margin:0 0 28px;font-size:15px;line-height:1.6;color:var(--muted)}
      .links{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
      a{display:inline-block;padding:10px 18px;border-radius:8px;font-size:14px;
        font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--navy)}
      a.primary{background:var(--gold);border-color:var(--gold);color:var(--navy)}
      a:hover{border-color:var(--blue)}
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">Error 404</p>
      <h1>That page isn’t here</h1>
      <p>The link may be out of date, or the page may have moved. Try one of these instead.</p>
      <div class="links">
        <a class="primary" href="/">Home</a>
        <a href="/agenda/">Agenda</a>
        <a href="/speaker-sponsor/">Logistics</a>
        <a href="/about/">About</a>
      </div>
    </main>
  </body>
</html>
